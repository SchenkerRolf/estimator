<style>
/* Eigene Styles bauen ausschliesslich auf den Tokens des Designsystems auf. */
:root{
  --bg: var(--stzh-color-white, #fff);
  --panel: var(--stzh-color-grey10, #f4f4f4);
  --text: var(--stzh-color-black, #000);
  --muted: var(--stzh-color-grey80, #606060);
  --line: var(--stzh-color-grey30, #d2d2d2);
  --primary: var(--stzh-color-primary, #0F05A0);
  --primary-60: var(--stzh-color-midnightblue60, #3431DE);
  --primary-10: var(--stzh-color-midnightblue10, #EFF5FF);
  --low: var(--stzh-color-cobaltblue70, #002F96);
  --low-bg: var(--stzh-color-cobaltblue10, #E6F7FF);
  --low-line: var(--stzh-color-cobaltblue60, #0353DC);
  --high: var(--stzh-color-orange70, #B23A01);
  --high-bg: var(--stzh-color-orange10, #FEF5EA);
  --high-line: var(--stzh-color-orange60, #EB5E00);
  /* Diagramm: ordinale Rampe aus midnightblue 40–80 (validiert), Sonderkarten in coolgrey */
  --v-05: var(--stzh-color-midnightblue40, #6496FF);
  --v-1:  var(--stzh-color-midnightblue50, #3D6BFF);
  --v-2:  var(--stzh-color-midnightblue60, #3431DE);
  --v-3:  var(--stzh-color-midnightblue70, #0F05A0);
  --v-5:  var(--stzh-color-midnightblue80, #070066);
  --v-q:  var(--stzh-color-coolgrey40, #8DAFBC);
  --v-c:  var(--stzh-color-coolgrey60, #5F7A83);
  --space-xs: var(--stzh-space-xsmall, .5rem);
  --space-s: var(--stzh-space-small, .75rem);
  --space-m: var(--stzh-space-medium, 1rem);
  --space-l: var(--stzh-space-xlarge, 1.5rem);
  --space-xl: var(--stzh-space-xxlarge, 2rem);
  --f-regular: var(--stzh-font-family-regular, "Helvetica Neue", Helvetica, Arial, sans-serif);
  --f-medium: var(--stzh-font-family-medium, "Helvetica Neue", Helvetica, Arial, sans-serif);
  --f-heavy: var(--stzh-font-family-heavy, "Helvetica Neue", Helvetica, Arial, sans-serif);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-regular);font-size:1rem;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--stzh-flyingfocus-color, #0353DC);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
h1,h2{font-family:var(--f-heavy);font-weight:normal;margin:0;letter-spacing:-.01em}

/* ---------- App-Leiste ---------- */
.appbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar-in{max-width:880px;margin:0 auto;padding:var(--space-s) 16px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-s);flex-wrap:wrap}
.brand{font-family:var(--f-heavy);font-size:1.375rem;color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:.625rem}
.brand i{width:14px;height:22px;background:var(--primary);display:inline-block;box-shadow:6px -4px 0 var(--primary-60)}
.session{display:flex;align-items:center;gap:var(--space-s);flex-wrap:wrap}
.code{font-family:var(--f-medium);letter-spacing:.12em;background:var(--primary-10);color:var(--primary);padding:.125rem .5rem}

/* ---------- Einstieg ---------- */
.entry{min-height:calc(100vh - 60px);display:grid;place-items:start center;padding:var(--space-xl) 16px}
.entry-card{width:100%;max-width:440px}
.entry h1{font-size:2rem;line-height:1.15;color:var(--primary);margin-bottom:var(--space-xs)}
.entry .lead{font-size:1.125rem;margin:0 0 var(--space-l)}
.stack{display:flex;flex-direction:column;gap:var(--space-m)}
.divider{display:flex;align-items:center;gap:var(--space-s);color:var(--muted);font-size:.875rem;margin:var(--space-xl) 0 var(--space-m)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--stzh-color-error60, #DC030E);font-size:.875rem;min-height:1.3em}
.loading{display:flex;justify-content:center;padding:var(--space-xl) 0}

/* ---------- Raum ---------- */
.layout{max-width:880px;margin:0 auto;padding:var(--space-l) 16px var(--space-xl);display:flex;flex-direction:column;gap:var(--space-m)}
.panel{background:var(--panel);padding:var(--space-l)}
.current{display:flex;align-items:center;justify-content:space-between;gap:var(--space-m);flex-wrap:wrap}
.current .eyebrow{font-family:var(--f-medium);font-size:.875rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.current h1{font-size:2rem;color:var(--primary);line-height:1.15}
.me{display:flex;align-items:center;gap:var(--space-m);flex-wrap:wrap}
.me .who{font-family:var(--f-medium)}

.progress{display:flex;align-items:center;justify-content:space-between;gap:var(--space-s);flex-wrap:wrap;margin-bottom:var(--space-l)}
.progress .count{font-family:var(--f-medium);font-size:1.125rem}
.bar{height:4px;background:var(--line);margin-top:.375rem;width:200px;max-width:100%}
.bar>i{display:block;height:100%;background:var(--primary);transition:width .3s}
.actions{display:flex;gap:var(--space-xs);flex-wrap:wrap;align-items:center}
.seats{display:flex;flex-wrap:wrap;gap:var(--space-m) var(--space-s);justify-content:center}
.seat{width:92px;display:flex;flex-direction:column;align-items:center;gap:.375rem;text-align:center}
.seat.off{opacity:.45}
.pcard{width:56px;height:78px;display:grid;place-items:center;font-family:var(--f-heavy);font-size:1.5rem;border:2px dashed var(--stzh-color-grey50, #aaa);background:transparent;color:var(--muted)}
.pcard.down{border:2px solid var(--primary);background:repeating-linear-gradient(135deg,var(--primary) 0 6px,var(--primary-60) 6px 12px)}
.pcard.up{border:2px solid var(--text);background:var(--bg);color:var(--text);animation:flip .35s ease-out}
.pcard.none{font-size:1rem}
.seat.low .pcard.up{border-color:var(--low-line);background:var(--low-bg);color:var(--low)}
.seat.high .pcard.up{border-color:var(--high-line);background:var(--high-bg);color:var(--high)}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
@media (prefers-reduced-motion: reduce){.pcard.up{animation:none}}
.seat .nm{font-family:var(--f-medium);font-size:.875rem;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .tag{font-family:var(--f-medium);font-size:.75rem;padding:0 .5rem;line-height:1.5}
.seat.low .tag{background:var(--low-bg);color:var(--low)}
.seat.high .tag{background:var(--high-bg);color:var(--high)}
.seat .sub{font-size:.75rem;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--stzh-link-color, #0F05A0);text-decoration:underline;font-size:.75rem}
.observers{margin-top:var(--space-l);font-size:.875rem;color:var(--muted);text-align:center}
.empty{color:var(--muted);text-align:center;padding:var(--space-s) 0}

.result{display:flex;flex-direction:column;gap:var(--space-m)}
.result .big{font-family:var(--f-heavy);font-size:1.5rem;color:var(--primary)}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-s)}
@media (max-width:520px){.spread{grid-template-columns:1fr}}
.spread>div{padding:var(--space-s) var(--space-m);border-left:4px solid}
.spread .lo{background:var(--low-bg);color:var(--low);border-color:var(--low-line)}
.spread .hi{background:var(--high-bg);color:var(--high);border-color:var(--high-line)}
.spread .k{font-family:var(--f-medium);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.spread .v{font-family:var(--f-heavy);font-size:1.5rem}
.spread .who{font-size:.875rem;overflow-wrap:anywhere}
.hint{margin:0}

.chart{display:flex;align-items:center;gap:var(--space-l);flex-wrap:wrap;background:var(--bg);padding:var(--space-m)}
.donut{flex:none;width:168px;height:168px;position:relative}
.donut svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.donut circle.seg{pointer-events:stroke;fill:none;stroke-width:30;transition:stroke-width .12s}
.donut circle.seg:hover,.donut circle.seg.hl{stroke-width:36}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut .mid b{display:block;font-family:var(--f-heavy);font-weight:normal;font-size:1.75rem;line-height:1.1}
.donut .mid span{font-size:.75rem;color:var(--muted)}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:14px max-content 3.5ch 5ch;justify-content:start;gap:.5rem .875rem;align-items:center;font-size:.9375rem}
.legend li{display:contents}
.legend .sw{width:14px;height:14px}
.legend .lv{font-family:var(--f-medium)}
.legend .lc,.legend .lp{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.legend li.hl>*{color:var(--text)}
.legend li.hl .lv{text-decoration:underline;text-underline-offset:3px}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--text);color:var(--bg);font-size:.875rem;padding:.375rem .625rem;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 10px));transition:opacity .1s}
.tip.show{opacity:1}

.deck-wrap{position:sticky;bottom:0;z-index:4;padding:var(--space-s) 0 calc(var(--space-s) + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,transparent)}
.deck{display:flex;gap:.625rem;justify-content:center;flex-wrap:wrap}
.dcard{width:60px;height:84px;border:2px solid var(--primary);background:var(--bg);color:var(--primary);font-family:var(--f-heavy);font-size:1.5rem;transition:transform .15s,background .15s,color .15s}
.dcard:hover:not(:disabled){background:var(--primary-10);transform:translateY(-4px)}
.dcard[aria-pressed="true"]{transform:translateY(-10px);background:var(--primary);color:var(--stzh-color-white, #fff)}
.dcard:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:420px){.dcard{width:44px;height:64px;font-size:1.125rem}.deck{gap:.375rem}}
.deck-wrap.done{position:static;background:none}
@media (max-width:520px){.appbar{position:static}}
.deck-note{text-align:center;font-size:.875rem;color:var(--muted);margin-top:var(--space-xs)}

/* Fallback-Toast, falls die Komponenten nicht laden */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:.625rem 1rem;font-size:.9375rem;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>
<stzh-toastbar id="toastbar" hide-after="4" max="3"></stzh-toastbar>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip"></div>
<stzh-dialog id="confirm" heading="Bestätigen" close-on-escape-key>
  <stzh-text><p id="confirmText"></p></stzh-text>
  <stzh-actions slot="actions" variant="dialog">
    <stzh-button slot="primary" id="confirmOk">OK</stzh-button>
    <stzh-button slot="secondary" variant="secondary" id="confirmCancel">Abbrechen</stzh-button>
  </stzh-actions>
</stzh-dialog>
<stzh-dialog id="pick" heading="Moderation übergeben" close-on-escape-key>
  <stzh-text><p id="pickText">Wer soll die Moderation übernehmen?</p></stzh-text>
  <div id="pickList" style="margin-top:var(--space-m)"></div>
  <stzh-actions slot="actions" variant="dialog">
    <stzh-button slot="primary" id="pickOk">Übergeben</stzh-button>
    <stzh-button slot="secondary" variant="secondary" id="pickCancel">Abbrechen</stzh-button>
  </stzh-actions>
</stzh-dialog>

<script type="module">
/* =====================================================================
   Schätzrunde – Echtzeit über Firebase Realtime Database
   Die Konfiguration unten ist kein Geheimnis: Zugriffe werden über die
   Sicherheitsregeln (database.rules.json) geschützt.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD_wnlktazFzKqSXWciZA6wYaO6-_wwu20",
  authDomain: "estimator-bcf3a.firebaseapp.com",
  databaseURL: "https://estimator-bcf3a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "estimator-bcf3a",
  storageBucket: "estimator-bcf3a.firebasestorage.app",
  messagingSenderId: "296669176500",
  appId: "1:296669176500:web:91193f0cbeacb233752de1",
};
const FIREBASE_VERSION = "12.19.0";

/* ================= Konfiguration ================= */
const SCALE   = ["0.5", "1", "2", "3", "5", "?", "☕"];
const NUMERIC = { "0.5": 0.5, "1": 1, "2": 2, "3": 3, "5": 5 };
const STALE_MS = 12 * 60 * 60 * 1000;     // Sessions ohne Änderung seit 12 h werden aufgeräumt
const params = new URLSearchParams(location.search);
const USE_LOCAL = params.get("transport") === "local"; // Testmodus ohne Firebase (Tabs im selben Browser)
const KEEP = USE_LOCAL ? { transport: "local" } : {};
const linkFor = code => "?" + new URLSearchParams(code ? { s: code, ...KEEP } : KEEP);

/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clean = (s, max) => String(s ?? "").replace(/[\u0000-\u001f\u007f]/g, " ").trim().slice(0, max);
const genCode = () => String(100 + crypto.getRandomValues(new Uint32Array(1))[0] % 900); // 100–999
const parseCode = s => { const c = String(s ?? "").replace(/\D/g, ""); return /^[1-9][0-9]{2}$/.test(c) ? c : null; };
const fmt = n => (Math.round(n * 10) / 10).toString();
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const P = {
  meta: c => `sessions/${c}/meta`,
  people: c => `sessions/${c}/people`,
  person: (c, u) => `sessions/${c}/people/${u}`,
  votes: c => `sessions/${c}/votes`,
  vote: (c, u) => `sessions/${c}/votes/${u}`,
};

/* ================= UI-Helfer (Designsystem Stadt Zürich) ================= */
let toastT;
function toast(msg, type = "info") {
  const tb = $("#toastbar");
  if (customElements.get("stzh-toastbar") && tb && typeof tb.toast === "function") { tb.toast(msg, { type }); return; }
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");       // Fallback ohne Komponenten
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}
function fail(e, what) {
  console.error(what, e);
  const denied = String(e && (e.code || e.message) || "").toLowerCase().includes("permission");
  toast(denied ? `${what}: nicht erlaubt` : `${what} fehlgeschlagen. Verbindung prüfen.`, "error");
}
// Bestätigungsdialog (stzh-dialog), Fallback: window.confirm
function confirmDialog(title, text, okLabel) {
  const dlg = $("#confirm");
  if (!customElements.get("stzh-dialog") || typeof dlg.show !== "function") return Promise.resolve(confirm(`${title}\n\n${text}`));
  dlg.heading = title; $("#confirmText").textContent = text; $("#confirmOk").textContent = okLabel;
  return new Promise(res => {
    let done = false;
    const finish = v => { if (done) return; done = true; cleanup(); dlg.hide(); res(v); };
    const ok = () => finish(true), no = () => finish(false), closed = () => finish(false);
    const cleanup = () => { $("#confirmOk").removeEventListener("click", ok); $("#confirmCancel").removeEventListener("click", no); dlg.removeEventListener("stzhClose", closed); };
    $("#confirmOk").addEventListener("click", ok); $("#confirmCancel").addEventListener("click", no); dlg.addEventListener("stzhClose", closed);
    dlg.show();
  });
}
// Auswahldialog (stzh-dialog + stzh-radiogroup), Fallback: nummerierte Abfrage
function pickDialog(options) {
  const dlg = $("#pick");
  if (!customElements.get("stzh-dialog") || typeof dlg.show !== "function") {
    const n = parseInt(prompt("Moderation übergeben an:\n" + options.map((o, i) => `${i + 1}: ${o.label}`).join("\n")), 10);
    return Promise.resolve(options[n - 1] ? options[n - 1].value : null);
  }
  $("#pickList").innerHTML = `<stzh-radiogroup id="pickGroup" legend="Person" hide-legend value="${esc(options[0].value)}">${options.map((o, i) =>
    `<stzh-radio value="${esc(o.value)}" label="${esc(o.label)}"${i === 0 ? " checked" : ""}></stzh-radio>`).join("")}</stzh-radiogroup>`;
  let chosen = options[0].value;
  const grp = $("#pickGroup");
  grp.addEventListener("stzhChange", e => { e.stopPropagation(); if (e.detail && e.detail.value) chosen = e.detail.value; });
  return new Promise(res => {
    let done = false;
    const finish = v => { if (done) return; done = true; cleanup(); dlg.hide(); res(v); };
    const ok = () => finish(options.some(o => o.value === chosen) ? chosen : null), no = () => finish(null), closed = () => finish(null);
    const cleanup = () => { $("#pickOk").removeEventListener("click", ok); $("#pickCancel").removeEventListener("click", no); dlg.removeEventListener("stzhClose", closed); };
    $("#pickOk").addEventListener("click", ok); $("#pickCancel").addEventListener("click", no); dlg.addEventListener("stzhClose", closed);
    dlg.show();
  });
}
// Technische Fehler in verständliche Hinweise übersetzen (inkl. Fehlercode für die Fehlersuche)
function describeError(e) {
  const raw = `${(e && e.code) || ""} ${(e && e.message) || e || ""}`;
  const t = raw.toLowerCase();
  let hint;
  if (t.includes("referer") || t.includes("referrer")) hint = "Der API-Key ist für diese Adresse gesperrt. In der Google Cloud Console bei «Websites» die genaue Adresse dieser Seite eintragen, z. B. https://BENUTZERNAME.github.io/*";
  else if (t.includes("api-key-service-blocked") || t.includes("api_key_service_blocked") || t.includes("are blocked")) hint = "Der API-Key darf die Anmeldung nicht verwenden. In der Google Cloud Console bei den API-Einschränkungen «Identity Toolkit API» und «Token Service API» erlauben.";
  else if (t.includes("api-key-not-valid") || t.includes("invalid-api-key")) hint = "Der API-Key in index.html ist ungültig.";
  else if (t.includes("operation-not-allowed") || t.includes("admin-restricted-operation")) hint = "Die anonyme Anmeldung ist in Firebase nicht aktiviert (Authentication → Anmeldemethode → Anonym).";
  else if (t.includes("permission_denied") || t.includes("permission denied") || t.includes("permission-denied")) hint = "Die Datenbank-Regeln verweigern den Zugriff. Sind die aktuellen Regeln aus database.rules.json in Firebase veröffentlicht?";
  else if (t.includes("network-request-failed") || t.includes("failed to fetch") || t.includes("networkerror")) hint = "Keine Verbindung zu Google/Firebase. Eventuell blockiert ein Netzwerkfilter googleapis.com oder firebasedatabase.app.";
  else hint = "Unbekannter Fehler.";
  const code = clean(raw, 160);
  return code ? `${hint} (Technisch: ${code})` : hint;
}
// Nur neu zeichnen, wenn sich der Inhalt geändert hat (Web Components nicht unnötig neu erzeugen)
function setHTML(el, html) { if (el && el.__html !== html) { el.__html = html; el.innerHTML = html; } }
const valueOf = el => (el ? String(el.value ?? "") : "");
const BRAND = `<a class="brand" href="${esc(location.pathname + (USE_LOCAL ? "?transport=local" : ""))}"><i aria-hidden="true"></i>Schätzrunde</a>`;
const appbar = right => `<header class="appbar"><div class="appbar-in">${BRAND}<div class="session">${right || ""}</div></div></header>`;

/* ================= Einstiegsbildschirme ================= */
const app = $("#app");
const savedName = () => store.get("sr-name") || "";

function showLoading(text) {
  app.onclick = app.onchange = null;
  app.innerHTML = `${appbar()}<main class="entry"><div class="entry-card"><div class="loading"><stzh-loader label="${esc(text)}"></stzh-loader></div></div></main>`;
}
function showError(text) {
  app.innerHTML = `${appbar()}<main class="entry"><div class="entry-card stack">
    <h1>Keine Verbindung</h1>
    <stzh-message type="error" hide-close description="${esc(text)}"></stzh-message>
    <div><stzh-button id="retry" icon="reload">Nochmals versuchen</stzh-button></div></div></main>`;
  $("#retry").addEventListener("click", () => location.reload());
}

function showStart(msg) {
  app.onclick = app.onchange = null;
  history.replaceState(null, "", location.pathname + (USE_LOCAL ? linkFor() : ""));
  app.innerHTML = `${appbar()}
  <main class="entry"><div class="entry-card">
    <h1>Gemeinsam schätzen</h1>

/* ================= Datenbank-Adapter =================
   Einheitliche Schnittstelle, damit die App-Logik nicht von Firebase abhängt.
   firebaseAdapter: echte Datenbank. localAdapter: Nachbildung für Tests. */
async function firebaseAdapter() {
  const B = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [A, AU, D] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-database.js")]);
  const app = A.getApps().length ? A.getApp() : A.initializeApp(FIREBASE_CONFIG);
  const auth = AU.getAuth(app);
  await auth.authStateReady();
  if (!auth.currentUser) await AU.signInAnonymously(auth);
  const db = D.getDatabase(app);
  let offset = 0;
  D.onValue(D.ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });
  return {
    uid: auth.currentUser.uid,
    TS: D.serverTimestamp(),
    onValue: (p, cb, err) => D.onValue(D.ref(db, p), s => cb(s.val()), e => err && err(e)),
    get: async p => (await D.get(D.ref(db, p))).val(),
    update: o => D.update(D.ref(db), o),
    onDisconnectUpdate: (p, o) => D.onDisconnect(D.ref(db, p)).update(o),
    cancelOnDisconnect: p => D.onDisconnect(D.ref(db, p)).cancel(),
    onConnected: cb => D.onValue(D.ref(db, ".info/connected"), s => cb(!!s.val())),
    serverNow: () => Date.now() + offset,
    staleCodes: async cutoff => Object.keys((await D.get(D.query(D.ref(db, "index"), D.orderByValue(), D.endAt(cutoff), D.limitToFirst(20)))).val() || {}),
  };
}

function localAdapter() {
  // Nur zum Testen: «Datenbank» in localStorage, synchronisiert über Tabs desselben Browsers.
  const KEY = "sr-localdb";
  const TS = { ".sv": "timestamp" };
  let uid = sessionStorage.getItem("sr-local-uid");
  if (!uid) { uid = "u" + Math.random().toString(36).slice(2, 10); sessionStorage.setItem("sr-local-uid", uid); }
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const at = (root, p) => p.split("/").filter(Boolean).reduce((o, k) => (o && typeof o === "object" ? o[k] : undefined), root) ?? null;
  const listeners = new Set();
  const notify = () => { const root = read(); listeners.forEach(l => { const v = JSON.stringify(at(root, l.p)); if (v !== l.last) { l.last = v; l.cb(JSON.parse(v)); } }); };
  addEventListener("storage", e => { if (e.key === KEY) notify(); });
  const resolve = v => (v && typeof v === "object" ? (v[".sv"] ? Date.now() : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, resolve(x)]))) : v);
  const apply = o => {
    const root = read();
    for (const [p, v] of Object.entries(o)) {
      const ks = p.split("/").filter(Boolean); let cur = root;
      ks.slice(0, -1).forEach(k => { if (!cur[k] || typeof cur[k] !== "object") cur[k] = {}; cur = cur[k]; });
      if (v === null) delete cur[ks.at(-1)]; else cur[ks.at(-1)] = resolve(v);
    }
    localStorage.setItem(KEY, JSON.stringify(root)); notify();
  };
  const disc = {};
  addEventListener("pagehide", () => Object.values(disc).forEach(apply));
  return {
    uid, TS,
    onValue(p, cb) { const l = { p, cb, last: undefined }; listeners.add(l); setTimeout(notify, 0); return () => listeners.delete(l); },
    get: async p => at(read(), p),
    update: async o => apply(o),
    onDisconnectUpdate: async (p, o) => { disc[p] = Object.fromEntries(Object.entries(o).map(([k, v]) => [p + "/" + k, v])); },
    cancelOnDisconnect: async p => { delete disc[p]; },
    onConnected(cb) { setTimeout(() => cb(true), 0); return () => {}; },
    serverNow: () => Date.now(),
    staleCodes: async cutoff => Object.entries(read().index || {}).filter(([, v]) => v <= cutoff).map(([k]) => k),
  };
}

let DBP = null;
function db() {
  if (!DBP) DBP = (USE_LOCAL ? Promise.resolve().then(localAdapter) : firebaseAdapter()).catch(e => { DBP = null; throw e; });
  return DBP;
}

/* ================= Analyse der Stimmen ================= */
function analyze(people) {
  const voted = people.filter(p => p.vote != null);
  const nums = voted.filter(p => p.vote in NUMERIC);
  const special = {}, counts = {};
  voted.forEach(p => { counts[p.vote] = (counts[p.vote] || 0) + 1; if (!(p.vote in NUMERIC)) special[p.vote] = (special[p.vote] || 0) + 1; });
  if (!nums.length) return { voted, nums, special, counts };
  const vals = nums.map(p => NUMERIC[p.vote]);
  const min = Math.min(...vals), max = Math.max(...vals);
  return {
    voted, nums, special, counts, min, max, consensus: min === max,
    lows: nums.filter(p => NUMERIC[p.vote] === min),
    highs: nums.filter(p => NUMERIC[p.vote] === max),
  };
}

/* ================= Session anlegen / öffnen ================= */
async function createSession(name) {
  const d = await db();
  await cleanupStale(); // alte, vergessene Sessions zuerst entfernen – gibt Codes frei
  let lastErr = null, denied = 0;
  for (let i = 0; i < 40; i++) {
    const code = genCode();
    const meta = await d.get(P.meta(code));
    if (meta) {
      // Code belegt. Ist die Session verwaist (> 12 h), darf sie weg.
      if (!(meta.updatedAt < d.serverNow() - STALE_MS - 10 * 60 * 1000)) continue;
      try { await d.update({ [`sessions/${code}`]: null, [`index/${code}`]: null }); } catch { continue; }
    }
    try {
      await d.update({
        [P.meta(code)]: { host: d.uid, round: 1, revealed: false, createdAt: d.TS, updatedAt: d.TS },
        [P.person(code, d.uid)]: { name, role: "voter", online: true, joinedAt: d.TS },
        [`index/${code}`]: d.TS,
      });
      return code;
    } catch (e) {
      console.warn("Code", code, "nicht verfügbar", e); // evtl. gleichzeitig vergeben → nächster Versuch
      lastErr = e;
      if (String(e && (e.code || e.message)).toLowerCase().includes("permission") && ++denied >= 3) throw e; // Regeln blockieren grundsätzlich
    }
  }
  throw lastErr || new Error("Kein freier Code gefunden");
}

async function cleanupStale() {
  try {
    const d = await db();
    const codes = await d.staleCodes(d.serverNow() - STALE_MS - 10 * 60 * 1000);
    for (const c of codes.filter(parseCode)) await d.update({ [`sessions/${c}`]: null, [`index/${c}`]: null }).catch(() => {});
  } catch (e) { console.warn("Aufräumen übersprungen", e); }
}

async function openSession(code) {
  history.replaceState(null, "", location.pathname + linkFor(code));
  showLoading("Verbinde mit der Session…");
  let d;
  try { d = await db(); }
  catch (e) { console.error(e); return showError("Die Verbindung zum Server konnte nicht aufgebaut werden. " + describeError(e)); }
  try {
    const meta = await d.get(P.meta(code));
    if (!meta) return showStart(`Die Session ${code} gibt es nicht (mehr).`);
    const me = await d.get(P.person(code, d.uid));
    if (me) enterRoom(code); else showJoin(code);
  } catch (e) { console.error(e); showError("Die Session konnte nicht geladen werden. " + describeError(e)); }
}

let roomActions = null;
// Einmalig: Änderungen aus Designsystem-Komponenten (Radiogroup, Toggle) an die Raum-Aktionen weitergeben

  else if (t.closest("#hostVotes") && e.detail && typeof e.detail.checked === "boolean") roomActions.role(e.detail.checked ? "voter" : "observer");

function setConn(text, cls) {
  setHTML($("#conn"), `<stzh-status type="${cls === "ok" ? "success" : "warning"}" label="${esc(text)}"></stzh-status>`);
}

async function enterRoom(code) {
  const d = await db();
  const uid = d.uid;
  const S = { meta: undefined, people: undefined, votes: {}, connected: false };
  const unsubs = [];
  let unVotes = null, votesMode = null, autoRevealDone = null;

  const view = () => {
    const m = S.meta, round = m.round;
    const people = Object.entries(S.people || {})
      .filter(([, p]) => p && typeof p.name === "string")
      .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0))
      .map(([cid, p]) => {
        const v = S.votes[cid];
        return {
          cid, name: p.name, role: p.role === "observer" ? "observer" : "voter", online: p.online === true,
          voted: p.votedRound === round,
          vote: m.revealed && v && v.r === round ? v.v : null,
        };
      });
    return { code, round, revealed: !!m.revealed, host: m.host, people };
  };
  const myVote = () => { const v = S.votes[uid]; return v && S.meta && v.r === S.meta.round ? v.v : null; };

  function watchVotes() {
    const want = S.meta && S.meta.revealed ? "all" : "own";
    if (want === votesMode) return;
    if (unVotes) unVotes();
    votesMode = want; S.votes = {};
    if (want === "all") unVotes = d.onValue(P.votes(code), v => { S.votes = v || {}; render(); }, () => {});
    else unVotes = d.onValue(P.vote(code, uid), v => { S.votes = v ? { [uid]: v } : {}; render(); }, () => {});
  }

  let prevHost = null, selfTakeover = false;
  function render() {
    if (S.meta === undefined || S.people === undefined) return;
    const v = view();
    if (prevHost && prevHost !== v.host && v.host === uid && !selfTakeover) {
      const from = v.people.find(p => p.cid === prevHost);
      toast(`${from ? from.name : "Die Moderation"} hat dir die Moderation übergeben.`, "success");
    }
    prevHost = v.host; selfTakeover = false;
    renderRoom(v, { cid: uid, myVote: myVote(), connected: S.connected });
    // Automatisch aufdecken, sobald alle (online) Schätzenden gewählt haben – das darf jede:r auslösen
    if (!v.revealed && autoRevealDone !== v.round && v.people.some(p => p.cid === uid)) {
      const el = v.people.filter(p => p.role === "voter" && p.online);
      if (el.length && el.every(p => p.voted)) {
        autoRevealDone = v.round;
        d.update({ [P.meta(code) + "/revealed"]: true }).catch(e => { autoRevealDone = null; console.warn(e); });
      }
    }
  }

  let left = false;
  function leave(msg) {
    if (left) return; left = true;
    unsubs.forEach(u => u()); if (unVotes) unVotes();
    d.cancelOnDisconnect(P.person(code, uid)).catch(() => {});
    room = null; showStart(msg);
  }

  const actions = {
    vote(val) {
      const v = view(); const me = v.people.find(p => p.cid === uid);
      if (v.revealed || !me || me.role !== "voter") return;
      const next = myVote() === val ? null : val;
      S.votes = next ? { ...S.votes, [uid]: { v: next, r: v.round } } : Object.fromEntries(Object.entries(S.votes).filter(([k]) => k !== uid));
      render();
      d.update({
        [P.vote(code, uid)]: next ? { v: next, r: v.round } : null,
        [P.person(code, uid) + "/votedRound"]: next ? v.round : null,
      }).catch(e => fail(e, "Stimme"));
    },
    reveal() { d.update({ [P.meta(code) + "/revealed"]: true }).catch(e => fail(e, "Aufdecken")); },
    round() {
      d.update({
        [P.meta(code) + "/round"]: S.meta.round + 1,
        [P.meta(code) + "/revealed"]: false,
        [P.meta(code) + "/updatedAt"]: d.TS,
        [P.votes(code)]: null,
        [`index/${code}`]: d.TS,
      }).catch(e => fail(e, "Neue Runde"));
    },
    role(r) {
      const role = r === "observer" ? "observer" : "voter";
      store.set("sr-role", role);
      const o = { [P.person(code, uid) + "/role"]: role };
      if (role === "observer" && !S.meta.revealed && myVote() != null) { o[P.vote(code, uid)] = null; o[P.person(code, uid) + "/votedRound"] = null; }
      d.update(o).catch(e => fail(e, "Rolle ändern"));
    },
    kick(cid) { d.update({ [P.person(code, cid)]: null }).catch(e => fail(e, "Entfernen")); },
    takeover() {
      selfTakeover = true;
      d.update({ [P.meta(code) + "/host"]: uid, [P.meta(code) + "/updatedAt"]: d.TS, [`index/${code}`]: d.TS })
        .then(() => toast("Du moderierst jetzt", "success")).catch(e => fail(e, "Übernehmen"));
    },
    async handover() {
      const cands = view().people.filter(p => p.cid !== uid && p.online);
      if (!cands.length) return toast("Gerade ist niemand sonst online.", "warning");
      const target = await pickDialog(cands.map(p => ({ value: p.cid, label: p.name + (p.role === "observer" ? " (zuschauend)" : "") })));
      if (!target) return;
      const who = cands.find(p => p.cid === target);
      d.update({ [P.meta(code) + "/host"]: target, [P.meta(code) + "/updatedAt"]: d.TS, [`index/${code}`]: d.TS })
        .then(() => toast(`${who ? who.name : "Die Person"} moderiert jetzt.`, "success")).catch(e => fail(e, "Übergeben"));
    },
    async end() {
      if (!await confirmDialog("Session beenden?", "Die Session wird für alle beendet und alle Daten dieser Session werden gelöscht.", "Session beenden")) return;
      d.cancelOnDisconnect(P.person(code, uid)).catch(() => {});
      d.update({ [`sessions/${code}`]: null, [`index/${code}`]: null }).catch(e => fail(e, "Beenden"));
    },
  };

  mountRoom(code, actions);
  room = { code };

  // Online-Status: bei Verbindungsabbruch setzt der Server «offline»
  unsubs.push(d.onConnected(async on => {
    S.connected = on; setConn(on ? "Verbunden" : "Verbinde…", on ? "ok" : ""); render();
    if (!on || !S.people || !S.people[uid]) return;
    try {
      await d.onDisconnectUpdate(P.person(code, uid), { online: false });
      await d.update({ [P.person(code, uid) + "/online"]: true });
    } catch (e) { console.warn(e); }
  }));
  unsubs.push(d.onValue(P.meta(code), m => {
    if (!m) return leave("Die Session wurde beendet.");
    S.meta = m; watchVotes(); render();
  }, e => { console.error(e); leave("Kein Zugriff auf diese Session."); }));
  let wasIn = false;
  unsubs.push(d.onValue(P.people(code), p => {
    S.people = p || {};
    const inNow = !!S.people[uid];
    if (wasIn && !inNow) return leave("Du wurdest aus der Session entfernt.");
    if (!wasIn && inNow && S.connected) { // erster Eintritt: Online-Status sicherstellen
      d.onDisconnectUpdate(P.person(code, uid), { online: false }).then(() => {
        if (S.people[uid] && S.people[uid].online !== true) return d.update({ [P.person(code, uid) + "/online"]: true });
      }).catch(e => console.warn(e));
    }
    wasIn = inNow; render();
  }, e => console.error(e)));
}

/* Kreisdiagramm (Donut) der Stimmen – Farbe folgt dem Wert, nie der Rangfolge */
const VCOLOR = { "0.5": "--v-05", "1": "--v-1", "2": "--v-2", "3": "--v-3", "5": "--v-5", "?": "--v-q", "☕": "--v-c" };
const VLABEL = { "?": "? (unklar)", "☕": "☕ (Pause)" };
function donut(counts) {
  const entries = SCALE.filter(k => counts[k]).map(k => [k, counts[k]]);
  const total = entries.reduce((s, [, c]) => s + c, 0);
  if (!total) return "";
  const r = 60, C = 2 * Math.PI * r, gap = entries.length > 1 ? 2.5 : 0;
  let acc = 0;
  const segs = entries.map(([k, c]) => {
    const len = c / total * C, dash = Math.max(len - gap, 0.8);
    const pct = Math.round(c / total * 100);
    const tip = `${VLABEL[k] || k}: ${c} Stimme${c === 1 ? "" : "n"} (${pct} %)`;
    const el = `<circle class="seg" data-k="${esc(k)}" data-tip="${esc(tip)}" cx="84" cy="84" r="${r}" stroke="var(${VCOLOR[k]})"
      stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 84 84)"></circle>`;
    acc += len; return el;
  }).join("");
  const legend = entries.map(([k, c]) => `<li data-k="${esc(k)}"><span class="sw" style="background:var(${VCOLOR[k]})"></span><span class="lv">${esc(VLABEL[k] || k)}</span><span class="lc">${c}×</span><span class="lp">${Math.round(c / total * 100)} %</span></li>`).join("");
  return `<div class="chart">
    <div class="donut" role="img" aria-label="Verteilung der Stimmen: ${esc(entries.map(([k, c]) => `${k}: ${c}`).join(", "))}">
      <svg viewBox="0 0 168 168">${segs}</svg>
      <div class="mid"><div><b>${total}</b><span>Stimme${total === 1 ? "" : "n"}</span></div></div>
    </div>
    <ul class="legend">${legend}</ul>
  </div>`;
}
// Hover: Tooltip am Segment, passende Legendenzeile hervorheben
document.addEventListener("pointerover", e => {
  const t = e.target.closest && e.target.closest("[data-tip], .legend li");
  document.querySelectorAll(".chart .hl").forEach(x => x.classList.remove("hl"));
  const tip = $("#tip");
  if (!t) { tip.classList.remove("show"); return; }
  const k = t.dataset.k;
  document.querySelectorAll(`.chart [data-k="${CSS.escape(k)}"]`).forEach(x => x.classList.add("hl"));
  const seg = document.querySelector(`.donut [data-k="${CSS.escape(k)}"]`);
  if (seg) { tip.textContent = seg.dataset.tip; tip.classList.add("show"); }
});
document.addEventListener("pointermove", e => { const tip = $("#tip"); tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; });

/* view: { code, round, revealed, host, people[] }; me: { cid, myVote, connected } */
function renderRoom(view, me) {
  const isHost = view.host === me.cid;
  const people = view.people;
  const self = people.find(p => p.cid === me.cid);
  const hostP = people.find(p => p.cid === view.host);
  const voters = people.filter(p => p.role === "voter");
  const observers = people.filter(p => p.role !== "voter");
  const onlineVoters = voters.filter(p => p.online);
  const votedCount = onlineVoters.filter(p => p.voted).length;
  const iCanVote = self && self.role === "voter";
  const A = view.revealed ? analyze(people) : null;

  /* Hinweis, wenn die Moderation weg ist */
  setHTML($("#banner"), (!isHost && (!hostP || !hostP.online))
    ? `<stzh-message type="warning" hide-close label="Die Moderation ist offline">
        <p style="margin:0 0 .75rem">Jemand aus der Runde kann die Moderation übernehmen.</p>
        <stzh-button size="small" data-act="takeover">Moderation übernehmen</stzh-button>
      </stzh-message>` : "");

  $("#eyebrow").textContent = view.revealed ? "Aufgedeckt" : "Abstimmung läuft";
  $("#curTitle").textContent = "Runde " + view.round;

  /* Tisch */
  const spread = A && A.nums.length && !A.consensus;
  const lowSet = new Set(spread ? A.lows.map(p => p.cid) : []);
  const highSet = new Set(spread ? A.highs.map(p => p.cid) : []);
  const kick = p => isHost && p.cid !== me.cid && !p.online ? ` · <button class="linkbtn" data-act="kick" data-v="${esc(p.cid)}">entfernen</button>` : "";
  const seat = p => {
    const cls = ["seat", p.online ? "" : "off", lowSet.has(p.cid) ? "low" : "", highSet.has(p.cid) ? "high" : ""].join(" ");
    let card;
    if (view.revealed) card = p.vote != null ? `<div class="pcard up">${esc(p.vote)}</div>` : `<div class="pcard none" title="Nicht gewählt">–</div>`;
    else card = p.voted ? `<div class="pcard down" title="Hat gewählt"></div>` : `<div class="pcard" title="Wählt noch"></div>`;
    const tag = lowSet.has(p.cid) ? `<span class="tag">tiefster</span>` : highSet.has(p.cid) ? `<span class="tag">höchster</span>` : "";
    const subTxt = [p.cid === view.host ? "Moderation" : "", p.online ? "" : "offline"].filter(Boolean).join(" · ");
    const sub = subTxt || kick(p) ? `<span class="sub">${subTxt}${kick(p)}</span>` : "";
    return `<div class="${cls}">${card}<span class="nm" title="${esc(p.name)}">${esc(p.name)}${p.cid === me.cid ? " (du)" : ""}</span>${tag}${sub}</div>`;
  };
  const pct = onlineVoters.length ? Math.round(votedCount / onlineVoters.length * 100) : 0;
  const progress = view.revealed
    ? `<div><div class="count">Ergebnis</div><div class="muted small">${A.voted.length} Schätzung${A.voted.length === 1 ? "" : "en"}</div></div>`
    : `<div><div class="count">${votedCount} von ${onlineVoters.length} haben gewählt</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  const hostBtns = isHost ? (view.revealed
      ? `<stzh-button data-act="round" icon="reload">Neue Runde</stzh-button>`
      : `<stzh-button variant="tertiary" data-act="round" icon="reset">Neu starten</stzh-button><stzh-button data-act="reveal" icon="view"${votedCount ? "" : " disabled"}>Jetzt aufdecken</stzh-button>`) : "";
  setHTML($("#table"), `
    <div class="progress">${progress}<div class="actions">${hostBtns}</div></div>
    ${voters.length ? `<div class="seats">${voters.map(seat).join("")}</div>` : `<div class="empty">Noch niemand schätzt mit. Teile den Code!</div>`}
    ${observers.length ? `<div class="observers">Zuschauend: ${observers.map(p => esc(p.name) + (p.cid === me.cid ? " (du)" : "") + (p.cid === view.host ? " (Moderation)" : "") + (p.online ? "" : " (offline)") + kick(p)).join(", ")}</div>` : ""}`);

  /* Ergebnis */
  let res = "";
  if (view.revealed) {
    const chart = donut(A.counts);
    if (!A.voted.length) res = `<p class="hint">Niemand hat gewählt.</p>`;
    else if (!A.nums.length) res = `<div class="big">Keine Zahlen-Schätzung</div><p class="hint">Klärt die offenen Fragen und startet eine neue Runde.</p>${chart}`;
    else if (A.consensus) res = `<div class="big">Einig: ${esc(A.nums[0].vote)}</div>${chart}`;
    else {
      const names = arr => arr.map(p => esc(p.name)).join(", ");
      res = `<div class="spread">
          <div class="lo"><div class="k">Tiefster Wert</div><div class="v">${fmt(A.min)}</div><div class="who">${names(A.lows)}</div></div>
          <div class="hi"><div class="k">Höchster Wert</div><div class="v">${fmt(A.max)}</div><div class="who">${names(A.highs)}</div></div>
        </div>
        <p class="hint">Tiefster und höchster Wert erklären kurz ihre Sicht, danach stimmt ihr neu ab.</p>
        ${chart}`;
    }
    res = `<section class="panel result" aria-live="polite">${res}</section>`;
  }
  setHTML($("#result"), res);

  /* Karten-Deck */
  const dw = $("#deckWrap");
  if (iCanVote) {
    dw.style.display = ""; dw.classList.toggle("done", view.revealed); // aufgedeckt: Deck nicht mehr über dem Ergebnis schweben lassen
    setHTML(dw, `<div class="deck" role="group" aria-label="Deine Schätzung">${SCALE.map(v =>
      `<button class="dcard" data-act="vote" data-v="${esc(v)}" aria-pressed="${me.myVote === v}" ${view.revealed ? "disabled" : ""} aria-label="${v === "?" ? "Unklar" : v === "☕" ? "Pause" : v}">${esc(v)}</button>`).join("")}</div>
      <div class="deck-note">${view.revealed ? "Aufgedeckt. Warte auf die nächste Runde." : me.myVote != null ? "Gewählt. Nochmals tippen zum Zurücknehmen." : "Wähle deine Karte."}</div>`);
  } else { dw.style.display = "none"; setHTML(dw, ""); }

  /* Du */
  let meHtml = `<div class="who">${esc(self ? self.name : "…")}</div>`;
  if (isHost) {
    meHtml += `<stzh-toggle id="hostVotes" label="Ich schätze mit" hide-optional${self && self.role === "voter" ? " checked" : ""}></stzh-toggle>
      <stzh-button variant="secondary" size="small" icon="team" data-act="handover">Moderation übergeben</stzh-button>
      <stzh-button variant="secondary" size="small" icon="close" data-act="end">Session beenden</stzh-button>`;
  } else if (self) {
    meHtml += `<stzh-radiogroup id="roleGroup" legend="Rolle" hide-legend direction="horizontal" value="${self.role}">
      <stzh-radio value="voter" label="Mitschätzen"${self.role === "voter" ? " checked" : ""}></stzh-radio>
      <stzh-radio value="observer" label="Nur zuschauen"${self.role === "observer" ? " checked" : ""}></stzh-radio></stzh-radiogroup>`;
  }
  setHTML($("#me"), meHtml);
}

/* ================= Start ================= */
const code0 = parseCode(params.get("s"));
if (code0) openSession(code0);
else showStart();
db().catch(() => {}); // Verbindung schon vorbereiten
</script>
</body>
</html>

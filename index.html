<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schätzrunde</title>
<meta name="description" content="Schlankes Schätz-Tool für Refinements und Sprint Plannings. Kein Login, nichts wird gespeichert.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='16' height='22' rx='3' fill='%235fb3a1'/%3E%3Crect x='12' y='3' width='16' height='22' rx='3' fill='%232f6f62'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0eee9; --text:#1d1c1a; --muted:#6b6862;
  --border:#e3e0d9; --accent:#2f6f62; --accent-2:#3f8a7a; --accent-ink:#ffffff; --accent-soft:#e2efeb;
  --low:#2f62b8; --low-soft:#e3ebf8; --high:#b8501a; --high-soft:#fbe9dd;
  --ok:#2e7d52; --warn:#9a6a12; --danger:#b3261e;
  --shadow:0 1px 2px rgba(20,18,15,.05),0 6px 20px rgba(20,18,15,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141413; --surface:#1d1c1a; --surface-2:#262522; --text:#ecebe6; --muted:#a19d94;
    --border:#34322e; --accent:#5fb3a1; --accent-2:#78c4b3; --accent-ink:#0e1a17; --accent-soft:#1f3530;
    --low:#86abee; --low-soft:#1c2940; --high:#f09a64; --high-soft:#3b2619;
    --ok:#6cc596; --warn:#e0b25a; --danger:#f08a82;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;transition:background .15s,border-color .15s,transform .05s}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:44px}
label.field{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:0 0 6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ---------- Entry screens ---------- */
.entry{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.entry-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo svg{flex:none}
.entry h1{font-size:24px;letter-spacing:-.02em;margin:18px 0 4px}
.entry p.lead{color:var(--muted);margin:0 0 22px}
.stack{display:flex;flex-direction:column;gap:14px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:22px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.row{display:flex;gap:8px}
.row>.input{flex:1}
.err{color:var(--danger);font-size:13px;min-height:1em}

/* ---------- Room ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,calc((100vw - 860px)/2 + 16px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.session{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600;letter-spacing:.08em;background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:13px}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.conn.ok::before{background:var(--ok)}
.conn.bad::before{background:var(--danger)}
.layout{max-width:860px;margin:0 auto;padding:20px 16px 40px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}

.current{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.current h1{font-size:22px;line-height:1.3;letter-spacing:-.015em;margin:0}
.current .eyebrow{font-size:13px;color:var(--muted);font-weight:500}

.table-wrap{padding:22px 18px}
.progress{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.progress .count{font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px;width:180px;max-width:100%}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.seats{display:flex;flex-wrap:wrap;gap:14px 10px;justify-content:center}
.seat{width:86px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.seat.off{opacity:.4}
.pcard{width:54px;height:76px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:22px;border:2px dashed var(--border);background:transparent;color:var(--muted)}
.pcard.down{border:2px solid var(--accent);background:repeating-linear-gradient(135deg,var(--accent) 0 6px,var(--accent-2) 6px 12px);box-shadow:var(--shadow)}
.pcard.up{border:2px solid var(--border);background:var(--surface);color:var(--text);box-shadow:var(--shadow);animation:flip .35s ease-out}
.pcard.none{font-size:15px}
.seat.low .pcard.up{border-color:var(--low);background:var(--low-soft);color:var(--low)}
.seat.high .pcard.up{border-color:var(--high);background:var(--high-soft);color:var(--high)}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.seat .nm{font-size:13px;font-weight:500;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .tag{font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px;line-height:1.5}
.seat.low .tag{background:var(--low-soft);color:var(--low)}
.seat.high .tag{background:var(--high-soft);color:var(--high)}
.seat .sub{font-size:11px;color:var(--muted)}
.observers{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
.empty{color:var(--muted);text-align:center;padding:10px 0}

.result{display:flex;flex-direction:column;gap:12px}
.result .big{font-size:20px;font-weight:600;letter-spacing:-.01em}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.spread{grid-template-columns:1fr}}
.spread>div{border-radius:12px;padding:12px 14px}
.spread .lo{background:var(--low-soft);color:var(--low)}
.spread .hi{background:var(--high-soft);color:var(--high)}
.spread .k{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.spread .v{font-size:20px;font-weight:700}
.spread .who{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:14px;margin:0}
.dist{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;background:var(--surface-2);border-radius:99px;padding:3px 10px}
.chip b{font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .lbl{font-size:13px;color:var(--muted);margin-right:2px}

.deck-wrap{position:sticky;bottom:0;z-index:4;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.deck{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dcard{width:58px;height:82px;border-radius:12px;border:2px solid var(--border);background:var(--surface);font-weight:700;font-size:22px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,background .15s}
.dcard:hover:not(:disabled){transform:translateY(-4px);border-color:var(--accent)}
.dcard[aria-pressed="true"]{transform:translateY(-10px);background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dcard:disabled{opacity:.5}
@media (max-width:420px){.dcard{width:44px;height:64px;font-size:18px;border-radius:10px}.deck{gap:6px}}
.deck-note{text-align:center;font-size:13px;color:var(--muted);margin-top:8px}

.me{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.me .who{font-weight:600}
.me .note{flex-basis:100%;margin:0}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--high-soft);color:var(--high);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =====================================================================
   Schätzrunde – Echtzeit über Firebase Realtime Database
   Die Konfiguration unten ist kein Geheimnis: Zugriffe werden über die
   Sicherheitsregeln (database.rules.json) geschützt.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD_wnlktazFzKqSXWciZA6wYaO6-_wwu20",
  authDomain: "estimator-bcf3a.firebaseapp.com",
  databaseURL: "https://estimator-bcf3a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "estimator-bcf3a",
  storageBucket: "estimator-bcf3a.firebasestorage.app",
  messagingSenderId: "296669176500",
  appId: "1:296669176500:web:91193f0cbeacb233752de1",
};
const FIREBASE_VERSION = "12.19.0";

/* ================= Konfiguration ================= */
const SCALE   = ["0.5", "1", "2", "3", "5", "?", "☕"];
const NUMERIC = { "0.5": 0.5, "1": 1, "2": 2, "3": 3, "5": 5 };
const STALE_MS = 12 * 60 * 60 * 1000;     // Sessions ohne Änderung seit 12 h werden aufgeräumt
const params = new URLSearchParams(location.search);
const USE_LOCAL = params.get("transport") === "local"; // Testmodus ohne Firebase (Tabs im selben Browser)
const KEEP = USE_LOCAL ? { transport: "local" } : {};
const linkFor = code => "?" + new URLSearchParams(code ? { s: code, ...KEEP } : KEEP);

/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clean = (s, max) => String(s ?? "").replace(/[\u0000-\u001f\u007f]/g, " ").trim().slice(0, max);
function genCode() {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(6)), b => A[b % A.length]).join("");
}
const fmt = n => (Math.round(n * 10) / 10).toString();
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200);
}
function fail(e, what) {
  console.error(what, e);
  const denied = String(e && (e.code || e.message) || "").toLowerCase().includes("permission");
  toast(denied ? `${what}: nicht erlaubt` : `${what} fehlgeschlagen. Verbindung prüfen.`);
}
const LOGO = `<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="16" height="22" rx="3" fill="var(--accent-2)"/><rect x="12" y="3" width="16" height="22" rx="3" fill="var(--accent)"/></svg>`;
const P = {
  meta: c => `sessions/${c}/meta`,
  people: c => `sessions/${c}/people`,
  person: (c, u) => `sessions/${c}/people/${u}`,
  votes: c => `sessions/${c}/votes`,
  vote: (c, u) => `sessions/${c}/votes/${u}`,
};

/* ================= Datenbank-Adapter =================
   Einheitliche Schnittstelle, damit die App-Logik nicht von Firebase abhängt.
   firebaseAdapter: echte Datenbank. localAdapter: Nachbildung für Tests. */
async function firebaseAdapter() {
  const B = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [A, AU, D] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-database.js")]);
  const app = A.getApps().length ? A.getApp() : A.initializeApp(FIREBASE_CONFIG);
  const auth = AU.getAuth(app);
  await auth.authStateReady();
  if (!auth.currentUser) await AU.signInAnonymously(auth);
  const db = D.getDatabase(app);
  let offset = 0;
  D.onValue(D.ref(db, ".info/serverTimeOffset"), s => { offset = s.val() || 0; });
  return {
    uid: auth.currentUser.uid,
    TS: D.serverTimestamp(),
    onValue: (p, cb, err) => D.onValue(D.ref(db, p), s => cb(s.val()), e => err && err(e)),
    get: async p => (await D.get(D.ref(db, p))).val(),
    update: o => D.update(D.ref(db), o),
    onDisconnectUpdate: (p, o) => D.onDisconnect(D.ref(db, p)).update(o),
    cancelOnDisconnect: p => D.onDisconnect(D.ref(db, p)).cancel(),
    onConnected: cb => D.onValue(D.ref(db, ".info/connected"), s => cb(!!s.val())),
    serverNow: () => Date.now() + offset,
    staleCodes: async cutoff => Object.keys((await D.get(D.query(D.ref(db, "index"), D.orderByValue(), D.endAt(cutoff), D.limitToFirst(20)))).val() || {}),
  };
}

function localAdapter() {
  // Nur zum Testen: «Datenbank» in localStorage, synchronisiert über Tabs desselben Browsers.
  const KEY = "sr-localdb";
  const TS = { ".sv": "timestamp" };
  let uid = sessionStorage.getItem("sr-local-uid");
  if (!uid) { uid = "u" + Math.random().toString(36).slice(2, 10); sessionStorage.setItem("sr-local-uid", uid); }
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const at = (root, p) => p.split("/").filter(Boolean).reduce((o, k) => (o && typeof o === "object" ? o[k] : undefined), root) ?? null;
  const listeners = new Set();
  const notify = () => { const root = read(); listeners.forEach(l => { const v = JSON.stringify(at(root, l.p)); if (v !== l.last) { l.last = v; l.cb(JSON.parse(v)); } }); };
  addEventListener("storage", e => { if (e.key === KEY) notify(); });
  const resolve = v => (v && typeof v === "object" ? (v[".sv"] ? Date.now() : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, resolve(x)]))) : v);
  const apply = o => {
    const root = read();
    for (const [p, v] of Object.entries(o)) {
      const ks = p.split("/").filter(Boolean); let cur = root;
      ks.slice(0, -1).forEach(k => { if (!cur[k] || typeof cur[k] !== "object") cur[k] = {}; cur = cur[k]; });
      if (v === null) delete cur[ks.at(-1)]; else cur[ks.at(-1)] = resolve(v);
    }
    localStorage.setItem(KEY, JSON.stringify(root)); notify();
  };
  const disc = {};
  addEventListener("pagehide", () => Object.values(disc).forEach(apply));
  return {
    uid, TS,
    onValue(p, cb) { const l = { p, cb, last: undefined }; listeners.add(l); setTimeout(notify, 0); return () => listeners.delete(l); },
    get: async p => at(read(), p),
    update: async o => apply(o),
    onDisconnectUpdate: async (p, o) => { disc[p] = Object.fromEntries(Object.entries(o).map(([k, v]) => [p + "/" + k, v])); },
    cancelOnDisconnect: async p => { delete disc[p]; },
    onConnected(cb) { setTimeout(() => cb(true), 0); return () => {}; },
    serverNow: () => Date.now(),
    staleCodes: async cutoff => Object.entries(read().index || {}).filter(([, v]) => v <= cutoff).map(([k]) => k),
  };
}

let DBP = null;
function db() {
  if (!DBP) DBP = (USE_LOCAL ? Promise.resolve().then(localAdapter) : firebaseAdapter()).catch(e => { DBP = null; throw e; });
  return DBP;
}

/* ================= Analyse der Stimmen ================= */
function analyze(people) {
  const voted = people.filter(p => p.vote != null);
  const nums = voted.filter(p => p.vote in NUMERIC);
  const special = {}, counts = {};
  voted.forEach(p => { counts[p.vote] = (counts[p.vote] || 0) + 1; if (!(p.vote in NUMERIC)) special[p.vote] = (special[p.vote] || 0) + 1; });
  if (!nums.length) return { voted, nums, special, counts };
  const vals = nums.map(p => NUMERIC[p.vote]);
  const min = Math.min(...vals), max = Math.max(...vals);
  return {
    voted, nums, special, counts, min, max, consensus: min === max,
    lows: nums.filter(p => NUMERIC[p.vote] === min),
    highs: nums.filter(p => NUMERIC[p.vote] === max),
  };
}

/* ================= Einstiegsbildschirme ================= */
const app = $("#app");
const savedName = () => store.get("sr-name") || "";

function showLoading(text) {
  app.innerHTML = `<div class="entry"><div class="entry-card"><div class="logo">${LOGO} Schätzrunde</div><p class="lead" style="margin:18px 0 0">${esc(text)}</p></div></div>`;
}
function showError(text) {
  app.innerHTML = `<div class="entry"><div class="entry-card"><div class="logo">${LOGO} Schätzrunde</div>
    <h1>Keine Verbindung</h1><p class="lead">${esc(text)}</p>
    <button class="btn primary" onclick="location.reload()">Nochmals versuchen</button></div></div>`;
}

function showStart(msg) {
  app.onclick = app.onchange = null;
  history.replaceState(null, "", location.pathname + (USE_LOCAL ? linkFor() : ""));
  app.innerHTML = `
  <div class="entry"><div class="entry-card">
    <div class="logo">${LOGO} Schätzrunde</div>
    <h1>Gemeinsam schätzen</h1>
    <p class="lead">Kein Login. Starte eine Session und teile den Link mit deinem Team.</p>
    ${msg ? `<div class="banner" style="margin-bottom:16px">${esc(msg)}</div>` : ""}
    <form id="fStart" class="stack">
      <div><label class="field" for="nStart">Dein Name</label>
      <input id="nStart" class="input" maxlength="24" autocomplete="nickname" required value="${esc(savedName())}"></div>
      <button class="btn primary" type="submit" id="bStart">Neue Session starten</button>
      <div class="err" id="eStart"></div>
    </form>
    <div class="divider">oder beitreten</div>
    <form id="fJoin" class="stack">
      <div><label class="field" for="cJoin">Session-Code</label>
      <div class="row"><input id="cJoin" class="input" maxlength="6" placeholder="z. B. K7M2QX" autocapitalize="characters" autocomplete="off" required style="text-transform:uppercase;letter-spacing:.08em">
      <button class="btn" type="submit">Weiter</button></div></div>
    </form>
  </div></div>`;
  $("#fStart").onsubmit = async e => {
    e.preventDefault();
    const name = clean($("#nStart").value, 24); if (!name) return;
    store.set("sr-name", name);
    $("#bStart").disabled = true; $("#bStart").textContent = "Wird erstellt…";
    try { const code = await createSession(name); openSession(code); }
    catch (err) { console.error(err); $("#eStart").textContent = "Session konnte nicht erstellt werden. Verbindung prüfen und nochmals versuchen."; $("#bStart").disabled = false; $("#bStart").textContent = "Neue Session starten"; }
  };
  $("#fJoin").onsubmit = e => {
    e.preventDefault();
    const code = clean($("#cJoin").value, 6).toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length === 6) openSession(code);
  };
}

function showJoin(code) {
  let role = store.get("sr-role") === "observer" ? "observer" : "voter";
  app.innerHTML = `
  <div class="entry"><div class="entry-card">
    <div class="logo">${LOGO} Schätzrunde</div>
    <h1>Session <span class="code">${esc(code)}</span></h1>
    <p class="lead">Gib deinen Namen ein, dann bist du dabei.</p>
    <form id="fName" class="stack">
      <div><label class="field" for="nJoin">Dein Name</label>
      <input id="nJoin" class="input" maxlength="24" autocomplete="nickname" required value="${esc(savedName())}"></div>
      <div><span class="field">Ich möchte</span>
      <div class="seg" role="group" aria-label="Rolle">
        <button type="button" data-role="voter">Mitschätzen</button>
        <button type="button" data-role="observer">Nur zuschauen</button>
      </div></div>
      <button class="btn primary" type="submit" id="bJoin">Beitreten</button>
      <div class="err" id="eJoin"></div>
      <a class="small muted" href="${esc(location.pathname + (USE_LOCAL ? linkFor() : ""))}">Andere Session / neue starten</a>
    </form>
  </div></div>`;
  const seg = () => app.querySelectorAll("[data-role]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.role === role)));
  app.querySelectorAll("[data-role]").forEach(b => b.onclick = () => { role = b.dataset.role; seg(); });
  seg();
  $("#nJoin").focus();
  $("#fName").onsubmit = async e => {
    e.preventDefault();
    const name = clean($("#nJoin").value, 24); if (!name) return;
    store.set("sr-name", name); store.set("sr-role", role);
    $("#bJoin").disabled = true;
    try {
      const d = await db();
      await d.update({ [P.person(code, d.uid)]: { name, role, online: true, joinedAt: d.TS } });
      enterRoom(code);
    } catch (err) { console.error(err); $("#eJoin").textContent = "Beitreten fehlgeschlagen. Existiert die Session noch?"; $("#bJoin").disabled = false; }
  };
}

/* ================= Session anlegen / öffnen ================= */
async function createSession(name) {
  const d = await db();
  for (let i = 0; i < 5; i++) {
    const code = genCode();
    if (await d.get(P.meta(code))) continue; // Code schon vergeben
    await d.update({
      [P.meta(code)]: { host: d.uid, round: 1, revealed: false, createdAt: d.TS, updatedAt: d.TS },
      [P.person(code, d.uid)]: { name, role: "voter", online: true, joinedAt: d.TS },
      [`index/${code}`]: d.TS,
    });
    cleanupStale(); // alte, vergessene Sessions im Hintergrund entfernen
    return code;
  }
  throw new Error("Kein freier Code gefunden");
}

async function cleanupStale() {
  try {
    const d = await db();
    const codes = await d.staleCodes(d.serverNow() - STALE_MS - 10 * 60 * 1000);
    for (const c of codes) await d.update({ [`sessions/${c}`]: null, [`index/${c}`]: null }).catch(() => {});
  } catch (e) { console.warn("Aufräumen übersprungen", e); }
}

async function openSession(code) {
  history.replaceState(null, "", location.pathname + linkFor(code));
  showLoading("Verbinde mit der Session…");
  let d;
  try { d = await db(); }
  catch (e) { console.error(e); return showError("Die Verbindung zum Server konnte nicht aufgebaut werden. Eventuell blockiert ein Netzwerkfilter firebasedatabase.app bzw. googleapis.com."); }
  try {
    const meta = await d.get(P.meta(code));
    if (!meta) return showStart(`Die Session ${code} gibt es nicht (mehr).`);
    const me = await d.get(P.person(code, d.uid));
    if (me) enterRoom(code); else showJoin(code);
  } catch (e) { console.error(e); showError("Die Session konnte nicht geladen werden."); }
}

/* ================= Raum ================= */
let room = null; // aktueller Raum-Zustand

function mountRoom(code, actions) {
  app.innerHTML = `
  <header class="top">
    <div class="logo">${LOGO}<span>Schätzrunde</span></div>
    <div class="session">
      <span class="conn" id="conn">Verbinde…</span>
      <span class="code" title="Session-Code">${esc(code)}</span>
      <button class="btn small" id="copy">Link kopieren</button>
    </div>
  </header>
  <main class="layout">
    <section class="stage">
      <div id="banner"></div>
      <div class="panel current"><div><div class="eyebrow" id="eyebrow">Einen Moment…</div><h1 id="curTitle"></h1></div><div class="me" id="me"></div></div>
      <div class="panel table-wrap" id="table"><div class="empty">Lade…</div></div>
      <div id="result"></div>
      <div class="deck-wrap" id="deckWrap"></div>
    </section>
  </main>`;
  $("#copy").onclick = async () => {
    const url = location.origin + location.pathname + linkFor(code);
    try { await navigator.clipboard.writeText(url); toast("Link kopiert"); }
    catch { prompt("Link zum Teilen:", url); }
  };
  app.onclick = e => {
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    const a = b.dataset.act, v = b.dataset.v;
    if (actions[a]) actions[a](v);
  };
  app.onchange = e => { if (e.target.id === "hostVotes") actions.role(e.target.checked ? "voter" : "observer"); };
}

function setConn(text, cls) {
  const c = $("#conn"); if (!c) return;
  c.textContent = text; c.className = "conn " + (cls || "");
}

async function enterRoom(code) {
  const d = await db();
  const uid = d.uid;
  const S = { meta: undefined, people: undefined, votes: {}, connected: false };
  const unsubs = [];
  let unVotes = null, votesMode = null, autoRevealDone = null;

  const view = () => {
    const m = S.meta, round = m.round;
    const people = Object.entries(S.people || {})
      .filter(([, p]) => p && typeof p.name === "string")
      .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0))
      .map(([cid, p]) => {
        const v = S.votes[cid];
        return {
          cid, name: p.name, role: p.role === "observer" ? "observer" : "voter", online: p.online === true,
          voted: p.votedRound === round,
          vote: m.revealed && v && v.r === round ? v.v : null,
        };
      });
    return { code, round, revealed: !!m.revealed, host: m.host, people };
  };
  const myVote = () => { const v = S.votes[uid]; return v && S.meta && v.r === S.meta.round ? v.v : null; };

  function watchVotes() {
    const want = S.meta && S.meta.revealed ? "all" : "own";
    if (want === votesMode) return;
    if (unVotes) unVotes();
    votesMode = want; S.votes = {};
    if (want === "all") unVotes = d.onValue(P.votes(code), v => { S.votes = v || {}; render(); }, () => {});
    else unVotes = d.onValue(P.vote(code, uid), v => { S.votes = v ? { [uid]: v } : {}; render(); }, () => {});
  }

  function render() {
    if (S.meta === undefined || S.people === undefined) return;
    const v = view();
    renderRoom(v, { cid: uid, myVote: myVote(), connected: S.connected });
    // Automatisch aufdecken, sobald alle (online) Schätzenden gewählt haben – das darf jede:r auslösen
    if (!v.revealed && autoRevealDone !== v.round && v.people.some(p => p.cid === uid)) {
      const el = v.people.filter(p => p.role === "voter" && p.online);
      if (el.length && el.every(p => p.voted)) {
        autoRevealDone = v.round;
        d.update({ [P.meta(code) + "/revealed"]: true }).catch(e => { autoRevealDone = null; console.warn(e); });
      }
    }
  }

  let left = false;
  function leave(msg) {
    if (left) return; left = true;
    unsubs.forEach(u => u()); if (unVotes) unVotes();
    d.cancelOnDisconnect(P.person(code, uid)).catch(() => {});
    room = null; showStart(msg);
  }

  const actions = {
    vote(val) {
      const v = view(); const me = v.people.find(p => p.cid === uid);
      if (v.revealed || !me || me.role !== "voter") return;
      const next = myVote() === val ? null : val;
      S.votes = next ? { ...S.votes, [uid]: { v: next, r: v.round } } : Object.fromEntries(Object.entries(S.votes).filter(([k]) => k !== uid));
      render();
      d.update({
        [P.vote(code, uid)]: next ? { v: next, r: v.round } : null,
        [P.person(code, uid) + "/votedRound"]: next ? v.round : null,
      }).catch(e => fail(e, "Stimme"));
    },
    reveal() { d.update({ [P.meta(code) + "/revealed"]: true }).catch(e => fail(e, "Aufdecken")); },
    round() {
      d.update({
        [P.meta(code) + "/round"]: S.meta.round + 1,
        [P.meta(code) + "/revealed"]: false,
        [P.meta(code) + "/updatedAt"]: d.TS,
        [P.votes(code)]: null,
        [`index/${code}`]: d.TS,
      }).catch(e => fail(e, "Neue Runde"));
    },
    role(r) {
      const role = r === "observer" ? "observer" : "voter";
      store.set("sr-role", role);
      const o = { [P.person(code, uid) + "/role"]: role };
      if (role === "observer" && !S.meta.revealed && myVote() != null) { o[P.vote(code, uid)] = null; o[P.person(code, uid) + "/votedRound"] = null; }
      d.update(o).catch(e => fail(e, "Rolle ändern"));
    },
    kick(cid) { d.update({ [P.person(code, cid)]: null }).catch(e => fail(e, "Entfernen")); },
    takeover() {
      d.update({ [P.meta(code) + "/host"]: uid, [P.meta(code) + "/updatedAt"]: d.TS, [`index/${code}`]: d.TS })
        .then(() => toast("Du moderierst jetzt")).catch(e => fail(e, "Übernehmen"));
    },
    end() {
      if (!confirm("Session für alle beenden? Alle Daten dieser Session werden gelöscht.")) return;
      d.cancelOnDisconnect(P.person(code, uid)).catch(() => {});
      d.update({ [`sessions/${code}`]: null, [`index/${code}`]: null }).catch(e => fail(e, "Beenden"));
    },
  };

  mountRoom(code, actions);
  room = { code };

  // Online-Status: bei Verbindungsabbruch setzt der Server «offline»
  unsubs.push(d.onConnected(async on => {
    S.connected = on; setConn(on ? "Verbunden" : "Verbinde…", on ? "ok" : ""); render();
    if (!on || !S.people || !S.people[uid]) return;
    try {
      await d.onDisconnectUpdate(P.person(code, uid), { online: false });
      await d.update({ [P.person(code, uid) + "/online"]: true });
    } catch (e) { console.warn(e); }
  }));
  unsubs.push(d.onValue(P.meta(code), m => {
    if (!m) return leave("Die Session wurde beendet.");
    S.meta = m; watchVotes(); render();
  }, e => { console.error(e); leave("Kein Zugriff auf diese Session."); }));
  let wasIn = false;
  unsubs.push(d.onValue(P.people(code), p => {
    S.people = p || {};
    const inNow = !!S.people[uid];
    if (wasIn && !inNow) return leave("Du wurdest aus der Session entfernt.");
    if (!wasIn && inNow && S.connected) { // erster Eintritt: Online-Status sicherstellen
      d.onDisconnectUpdate(P.person(code, uid), { online: false }).then(() => {
        if (S.people[uid] && S.people[uid].online !== true) return d.update({ [P.person(code, uid) + "/online"]: true });
      }).catch(e => console.warn(e));
    }
    wasIn = inNow; render();
  }, e => console.error(e)));
}

/* view: { code, round, revealed, host, people[] }; me: { cid, myVote, connected } */
function renderRoom(view, me) {
  const isHost = view.host === me.cid;
  const people = view.people;
  const self = people.find(p => p.cid === me.cid);
  const hostP = people.find(p => p.cid === view.host);
  const voters = people.filter(p => p.role === "voter");
  const observers = people.filter(p => p.role !== "voter");
  const onlineVoters = voters.filter(p => p.online);
  const votedCount = onlineVoters.filter(p => p.voted).length;
  const iCanVote = self && self.role === "voter";
  const A = view.revealed ? analyze(people) : null;

  /* Hinweis, wenn die Moderation weg ist */
  $("#banner").innerHTML = (!isHost && (!hostP || !hostP.online))
    ? `<div class="banner" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <span>Die Moderation ist offline. Jemand kann übernehmen.</span>
        <button class="btn small" data-act="takeover">Moderation übernehmen</button></div>` : "";

  $("#eyebrow").textContent = view.revealed ? "Aufgedeckt" : "Abstimmung läuft";
  $("#curTitle").textContent = "Runde " + view.round;

  /* Tisch */
  const spread = A && A.nums.length && !A.consensus;
  const lowSet = new Set(spread ? A.lows.map(p => p.cid) : []);
  const highSet = new Set(spread ? A.highs.map(p => p.cid) : []);
  const kick = p => isHost && p.cid !== me.cid && !p.online ? ` · <button class="btn ghost small" style="padding:0 4px" data-act="kick" data-v="${esc(p.cid)}">entfernen</button>` : "";
  const seat = p => {
    const cls = ["seat", p.online ? "" : "off", lowSet.has(p.cid) ? "low" : "", highSet.has(p.cid) ? "high" : ""].join(" ");
    let card;
    if (view.revealed) card = p.vote != null ? `<div class="pcard up">${esc(p.vote)}</div>` : `<div class="pcard none" title="Nicht gewählt">–</div>`;
    else card = p.voted ? `<div class="pcard down" title="Hat gewählt"></div>` : `<div class="pcard" title="Wählt noch"></div>`;
    const tag = lowSet.has(p.cid) ? `<span class="tag">tiefster</span>` : highSet.has(p.cid) ? `<span class="tag">höchster</span>` : "";
    const subTxt = [p.cid === view.host ? "Moderation" : "", p.online ? "" : "offline"].filter(Boolean).join(" · ");
    const sub = subTxt || kick(p) ? `<span class="sub">${subTxt}${kick(p)}</span>` : "";
    return `<div class="${cls}">${card}<span class="nm" title="${esc(p.name)}">${esc(p.name)}${p.cid === me.cid ? " (du)" : ""}</span>${tag}${sub}</div>`;
  };
  const pct = onlineVoters.length ? Math.round(votedCount / onlineVoters.length * 100) : 0;
  const progress = view.revealed
    ? `<div><div class="count">Ergebnis</div><div class="muted small">${A.voted.length} Schätzung${A.voted.length === 1 ? "" : "en"}</div></div>`
    : `<div><div class="count">${votedCount} von ${onlineVoters.length} haben gewählt</div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  const hostBtns = isHost ? (view.revealed
      ? `<button class="btn" data-act="round">Neue Runde</button>`
      : `<button class="btn ghost" data-act="round" title="Stimmen verwerfen und neu beginnen">Neu starten</button><button class="btn primary" data-act="reveal" ${votedCount ? "" : "disabled"}>Jetzt aufdecken</button>`) : "";
  $("#table").innerHTML = `
    <div class="progress">${progress}<div class="actions">${hostBtns}</div></div>
    ${voters.length ? `<div class="seats">${voters.map(seat).join("")}</div>` : `<div class="empty">Noch niemand schätzt mit. Teile den Link!</div>`}
    ${observers.length ? `<div class="observers">Zuschauend: ${observers.map(p => esc(p.name) + (p.cid === me.cid ? " (du)" : "") + (p.cid === view.host ? " (Moderation)" : "") + (p.online ? "" : " (offline)") + kick(p)).join(", ")}</div>` : ""}`;

  /* Ergebnis */
  let res = "";
  if (view.revealed) {
    const specials = Object.entries(A.special).map(([k, c]) => `<span class="chip"><b>${c}×</b> ${esc(k)}</span>`).join("");
    const dist = SCALE.filter(k => A.counts[k]).map(k => `<span class="chip"><b>${esc(k)}</b> · ${A.counts[k]}×</span>`).join("");
    if (!A.voted.length) res = `<p class="hint">Niemand hat gewählt.</p>`;
    else if (!A.nums.length) res = `<div class="big">Keine Zahlen-Schätzung</div><div class="dist">${specials}</div><p class="hint">Klärt die offenen Fragen und startet eine neue Runde.</p>`;
    else if (A.consensus) res = `<div class="big">Einig: ${esc(A.nums[0].vote)} 🎉</div>${specials ? `<div class="dist">${specials}</div>` : ""}`;
    else {
      const names = arr => arr.map(p => esc(p.name)).join(", ");
      res = `<div class="spread">
          <div class="lo"><div class="k">Tiefster Wert</div><div class="v">${fmt(A.min)}</div><div class="who">${names(A.lows)}</div></div>
          <div class="hi"><div class="k">Höchster Wert</div><div class="v">${fmt(A.max)}</div><div class="who">${names(A.highs)}</div></div>
        </div>
        <p class="hint">Tiefster und höchster Wert erklären kurz ihre Sicht, danach stimmt ihr neu ab.</p>
        <div class="dist">${dist}</div>`;
    }
    res = `<div class="panel result">${res}</div>`;
  }
  $("#result").innerHTML = res;

  /* Karten-Deck */
  const dw = $("#deckWrap");
  if (iCanVote) {
    dw.style.display = "";
    dw.innerHTML = `<div class="deck" role="group" aria-label="Deine Schätzung">${SCALE.map(v =>
      `<button class="dcard" data-act="vote" data-v="${esc(v)}" aria-pressed="${me.myVote === v}" ${view.revealed ? "disabled" : ""} title="${v === "?" ? "Unklar" : v === "☕" ? "Pause" : v}">${esc(v)}</button>`).join("")}</div>
      <div class="deck-note">${view.revealed ? "Aufgedeckt. Warte auf die nächste Runde." : me.myVote != null ? "Gewählt. Nochmals tippen zum Zurücknehmen." : "Wähle deine Karte."}</div>`;
  } else { dw.style.display = "none"; dw.innerHTML = ""; }

  /* Du */
  let meHtml = `<div class="who">${esc(self ? self.name : "…")}</div>`;
  if (isHost) {
    meHtml += `<label class="check"><input type="checkbox" id="hostVotes" ${self && self.role === "voter" ? "checked" : ""}> Ich schätze mit</label>
      <button class="btn small" data-act="end">Session beenden</button>`;
  } else if (self) {
    meHtml += `<div class="seg" role="group" aria-label="Rolle">
      <button data-act="role" data-v="voter" aria-pressed="${self.role === "voter"}">Mitschätzen</button>
      <button data-act="role" data-v="observer" aria-pressed="${self.role === "observer"}">Nur zuschauen</button></div>`;
  }
  $("#me").innerHTML = meHtml;
}

/* ================= Start ================= */
const code0 = clean(params.get("s"), 6).toUpperCase().replace(/[^A-Z0-9]/g, "");
if (code0.length === 6) openSession(code0);
else showStart();
db().catch(() => {}); // Verbindung schon vorbereiten
</script>
